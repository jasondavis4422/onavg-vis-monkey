<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monkey Brain Vertex Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: black;
      color: white;
    }

    #page-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #upload-container {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 50;
    }

    #main-content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #brain-image {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      border: none;
      outline: none;
    }

    #table-container {
      position: fixed;
      /* stay in place while scrolling */
      bottom: 150px;
      /* distance from the bottom of the viewport */
      right: 10px;
      /* ← change: anchor to the right edge */
      font-size: 12px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      z-index: 40;
    }

    #table-container table {
      border-collapse: collapse;
    }

    #table-container th,
    #table-container td {
      border: 0.5px solid white;
      padding: 4px;
      text-align: center;
    }

    #info-container {
      position: fixed;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 60;
    }

    #homepage-button {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
    }

    #homepage-button button {
      padding: 8px 12px;
      background: #4682b4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    /* ----- search panel ----- */
    #search-panel {
      position: fixed;
      top: 10px;
      right: 120px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 8px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 90;
    }

    #search-panel label,
    #search-panel select,
    #search-panel input,
    #search-panel button {
      margin-right: 6px;
    }

    #shading-panel {
      position: fixed;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      padding: 8px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 85;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-direction: column;
      margin-top: 150px;
    }

    #toggle-shading-btn {
      padding: 8px 12px;
      background-color: #555;
      color: white;
      border: 2px solid #999;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    #toggle-shading-btn.active {
      background-color: #228b22;
      border-color: #00ff00;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    #finish-shading-btn {
      padding: 8px 12px;
      background-color: #4682b4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    #shading-status {
      color: #ccc;
      font-size: 12px;
      min-width: 150px;
    }

    #brain-image.shading-active {
      cursor: crosshair;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      border: none;
      outline: none;
      box-shadow: none;
    }

    /* MARKER – green "X" */
    .vertex-marker {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 120;
    }

    .vertex-marker::after {
      content: "X";
      color: rgba(0, 255, 0, 0.9);
      font-weight: bold;
      font-size: 14px;
      /* size of the X */
      position: absolute;
      left: -7px;
      /* centre the X on the click point */
      top: -7px;
    }

    .shading-overlay {
      position: absolute;
      width: 1px;
      height: 1px;
      background-color: rgba(0, 255, 0, 1);
      border: 0.1px solid rgba(0, 255, 0, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 110;
    }

    #clear-shading-btn {
      padding: 8px 12px;
      background-color: #8b4513;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

  <!-- Home‑page link -->
  <div id="homepage-button">
    <a href="instructions.html"><button>Instructions</button></a>
  </div>

  <div id="shading-panel">
    <button id="toggle-shading-btn">🖍️ Shade Region</button>
    <span id="shading-status">Shading OFF | Vertices: 0</span>
    <button id="finish-shading-btn">Finish & Export</button>
    <button id="clear-shading-btn">Clear Shading</button>
  </div>


  <!-- Search panel -->
  <div id="search-panel">
    <label for="ico-select">ICO space:</label>
    <select id="ico-select">
      <option value="ico8">ico8</option>
      <option value="ico16">ico16</option>
      <option value="ico32">ico32</option>
      <option value="MEBRAIN">MEBRAIN</option>
    </select>

    <label for="vertex-input">Vertex index:</label>
    <input type="number" id="vertex-input" min="0" placeholder="e.g. 123" />
    <button id="show-vertex-btn">Show</button>
  </div>

  <!-- File upload controls -->
  <div id="upload-container">
    <label for="imageUpload">Choose Monkey Brain Image File:</label>
    <input type="file" id="imageUpload" accept="image/*" />
    <br /><br />
    <label for="dataUpload">Choose Monkey Data File in TXT format:</label>
    <input type="file" id="dataUpload" accept=".txt" />
  </div>

  <div id="page-container">
    <div id="main-content">
      <div id="table-container">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>LH</th>
              <th>RH</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>ico8</td>
              <td>0-622</td>
              <td>623-1243</td>
            </tr>
            <tr>
              <td>ico16</td>
              <td>0-2484</td>
              <td>2485-4968</td>
            </tr>
            <tr>
              <td>ico32</td>
              <td>0-9929</td>
              <td>9930-19862</td>
            </tr>
            <tr>
              <td>MEBRAIN</td>
              <td>0-98022</td>
              <td>98023-196069</td>
            </tr>
          </tbody>
        </table>
      </div>
      <img id="brain-image" src="_static/ico8brain.png" alt="Brain Image" />
    </div>

    <div id="info-container">
      <p id="file-name"></p>
      <p id="vertex-info">

        Hover over the image to see vertex information. <br>
        Each vertex contains the relevant numerical and <br>
        string‑labeled parcel in the human brain.

      </p>
    </div>
  </div>

  <script>
    /* ==============================================================
       GLOBAL VARIABLES – unchanged
       ============================================================== */
    let mappingData = null,
      lookupTableIco8 = null,
      lookupTableIco16 = null,
      lookupTableIco32 = null,
      lookupTableIcoME = null,
      dataMatrix = null,
      currentIcoSpace = null,
      ds128_aparc = null,
      ds128_aparc_a2009s = null,
      ds128_aparc_DKTatlas = null,
      destrieux_aparc = null,
      dk_aparc = null,
      dkt_aparc = null,
      originalWidth = 0,
      originalHeight = 0,
      scaleX = 1,
      scaleY = 1;


    // Shading mode variables
    let shadingModeActive = false;
    let isDrawing = false;
    let shadedVerticesSet = new Set();
    let shadedOverlays = [];

    const image = $('#brain-image');
    const vertexInfo = $('#vertex-info');
    const fileNameInfo = $('#file-name');

    /* --------------------------------------------------------------
       Utility functions – unchanged
       -------------------------------------------------------------- */
    function determineIcoSpace(len) {
      switch (len) {
        case 1244: return 'ico8';
        case 4969: return 'ico16';
        case 19863: return 'ico32';
        case 190070: return 'MEBRAIN';
        default: return null;
      }
    }
    function getLookupTable(ico) {
      switch (ico) {
        case 'ico8': return lookupTableIco8;
        case 'ico16': return lookupTableIco16;
        case 'ico32': return lookupTableIco32;
        case 'MEBRAIN': return lookupTableIcoME;
        default: return null;
      }
    }
    function displayFileName() {
      const name = image.attr('src').split('/').pop();
      fileNameInfo.text(`File: ${name}`);
    }
    function updateDisplaySize() {
      const rect = image[0].getBoundingClientRect();
      const dispW = rect.width, dispH = rect.height;
      scaleX = originalWidth / dispW;
      scaleY = originalHeight / dispH;
    }
    function getVertexFromMapping(mx, my) {
      if (my >= 0 && my < originalHeight && mx >= 0 && mx < originalWidth) {
        const v = mappingData[my][mx];
        return v !== -1 ? v : null;
      }
      return null;
    }

    /* --------------------------------------------------------------
       Load all JSON files – unchanged
       -------------------------------------------------------------- */
    function loadData() {
      $.when(
        $.getJSON('_static/mapping_data_icoME.json', data => {
          mappingData = data;
          originalHeight = mappingData.length;
          originalWidth = mappingData[0].length;
        }),
        $.getJSON('_static/lookup_table_monkey_ico8.json', data => lookupTableIco8 = data),
        $.getJSON('_static/lookup_table_monkey_ico16.json', data => lookupTableIco16 = data),
        $.getJSON('_static/lookup_table_monkey_ico32.json', data => lookupTableIco32 = data),
        $.getJSON('_static/lookup_table_monkey_icoME.json', data => lookupTableIcoME = data),
        $.getJSON('_static/ds128_aparc.json', data => ds128_aparc = data),
        $.getJSON('_static/ds128_aparc.a2009s.json', data => ds128_aparc_a2009s = data),
        $.getJSON('_static/ds128_aparc.DKTatlas.json', data => ds128_aparc_DKTatlas = data),
        $.getJSON('_static/destrieux_labels.json', data => destrieux_aparc = data),
        $.getJSON('_static/dk_labels.json', data => dk_aparc = data),
        $.getJSON('_static/dkt_labels.json', data => dkt_aparc = data)
      ).done(() => {
        updateDisplaySize();
      });
    }

    /* --------------------------------------------------------------
       Helpers for vertex coordinates – unchanged
       -------------------------------------------------------------- */
    function getVertexCoordinates(icoSpace, vertex) {
      const table = getLookupTable(icoSpace);
      const index = table.indexOf(vertex);
      if (index === -1) return [];

      const coords = [];
      for (let y = 0; y < originalHeight; y++) {
        const row = mappingData[y];
        for (let x = 0; x < originalWidth; x++) {
          if (row[x] === index) {
            coords.push([x, y]);
          }
        }
      }
      return coords;
    }
    function validateVertex(icoSpace, vertex) {
      const table = getLookupTable(icoSpace);
      return table && vertex >= 0 && table.includes(vertex);
    }
    function drawMarker(xScreen, yScreen) {
      const $m = $('<div class="vertex-marker"></div>');
      const imgOffset = image.offset();
      $m.css({
        left: imgOffset.left + xScreen,
        top: imgOffset.top + yScreen
      });
      $('body').append($m);
    }

    /* --------------------------------------------------------------
       UI – file uploads – unchanged
       -------------------------------------------------------------- */
    $('#imageUpload').on('change', e => {
      const file = e.target.files[0];
      if (file) {
        fileNameInfo.text(`File: ${file.name}`);
        const url = URL.createObjectURL(file);
        image.attr('src', url).on('load', updateDisplaySize);
      }
    });
    $('#dataUpload').on('change', e => {
      const file = e.target.files[0];
      if (file) {
        fileNameInfo.text(`Data Matrix File: ${file.name}`);
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const txt = ev.target.result;
            dataMatrix = txt.replace(/\n/g, '')
              .replace(/[\[\]]/g, '')
              .split(',')
              .map(v => v.trim())
              .filter(v => v.length > 0)
              .map(v => parseFloat(v));
            const len = dataMatrix.length;
            currentIcoSpace = determineIcoSpace(len);
          } catch (err) {
            console.error('Error parsing TXT file:', err);
          }
        };
        reader.readAsText(file);
      }
    });

    /* --------------------------------------------------------------
       UI – reverse‑lookup button (numeric vertex)
       -------------------------------------------------------------- */
    $('#show-vertex-btn').on('click', () => {
      const ico = $('#ico-select').val();
      const vStr = $('#vertex-input').val();

      if (vStr === '' || isNaN(vStr)) {
        alert('Please type a numeric vertex index.');
        return;
      }
      const vertex = parseInt(vStr, 10);
      if (!validateVertex(ico, vertex)) {
        alert(`Vertex ${vertex} is not valid for ${ico}.`);
        return;
      }

      const allCoords = getVertexCoordinates(ico, vertex);
      if (allCoords.length === 0) {
        alert(`Vertex ${vertex} does not appear in the mapping image.`);
        return;
      }

      $('.vertex-marker').remove();
      allCoords.forEach(coord => {
        const [origX, origY] = coord;
        const screenX = Math.round(origX / scaleX);
        const screenY = Math.round(origY / scaleY);
        drawMarker(screenX, screenY);
      });
    });

    // -----------------------------------------------------------------
    // NEW: SHADING FEATURE FUNCTIONS (FREEFORM BLOB ROI)
    // -----------------------------------------------------------------

    let drawingPoints = [];
    let canvasOverlay = null;
    let drawingCanvas = null;
    let drawingCtx = null;

    function toggleShadingMode() {
      shadingModeActive = !shadingModeActive;
      const $btn = $('#toggle-shading-btn');

      if (shadingModeActive) {
        $btn.addClass('active');
        image.addClass('shading-active');
        clearDrawing();
        updateShadingStatus();
      } else {
        $btn.removeClass('active');
        image.removeClass('shading-active');
        updateShadingStatus();
      }
    }

    function updateShadingStatus() {
      const status = shadingModeActive ? 'ON' : 'OFF';
      const count = shadedVerticesSet.size;
      $('#shading-status').text(`Shading ${status} | Vertices: ${count}`);
    }

    function createDrawingCanvas() {
      if (canvasOverlay) {
        canvasOverlay.remove();
      }

      const imgOffset = image.offset();
      const rect = image[0].getBoundingClientRect();

      const $canvas = $('<canvas></canvas>');
      drawingCanvas = $canvas[0];
      drawingCanvas.width = rect.width;
      drawingCanvas.height = rect.height;

      drawingCtx = drawingCanvas.getContext('2d');

      $canvas.css({
        position: 'absolute',
        left: imgOffset.left,
        top: imgOffset.top,
        border: '1px dashed rgba(0, 255, 0, 0.5)',
        pointerEvents: 'none',
        zIndex: 115
      });

      $('body').append($canvas);
      canvasOverlay = $canvas;
    }

    function drawBrushStroke(x, y) {
      if (!drawingCtx) return;

      drawingCtx.strokeStyle = 'rgba(0, 255, 0, 0.6)';
      drawingCtx.lineWidth = 5;
      drawingCtx.lineCap = 'round';
      drawingCtx.lineJoin = 'round';

      if (drawingPoints.length === 0) {
        drawingCtx.beginPath();
        drawingCtx.moveTo(x, y);
      } else {
        drawingCtx.lineTo(x, y);
        drawingCtx.stroke();
      }

      drawingPoints.push({ x, y });
    }

    function closeBlobShape() {
      if (!drawingCtx || drawingPoints.length < 3) return;

      // Draw line back to start to close the shape
      const firstPoint = drawingPoints[0];
      drawingCtx.lineTo(firstPoint.x, firstPoint.y);
      drawingCtx.stroke();

      // Fill the shape
      drawingCtx.fillStyle = 'rgba(0, 255, 0, 0.15)';
      drawingCtx.fill();
    }

    function clearDrawing() {
      drawingPoints = [];
      if (canvasOverlay) {
        canvasOverlay.remove();
        canvasOverlay = null;
      }
      drawingCanvas = null;
      drawingCtx = null;
    }

    function pointInShape(point, shapePoints) {
      // Ray casting algorithm for point-in-polygon test
      const x = point.x;
      const y = point.y;
      let inside = false;

      for (let i = 0, j = shapePoints.length - 1; i < shapePoints.length; j = i++) {
        const xi = shapePoints[i].x;
        const yi = shapePoints[i].y;
        const xj = shapePoints[j].x;
        const yj = shapePoints[j].y;

        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }

      return inside;
    }

    function findVerticesInBlob(shapeScreenCoords) {
      if (shapeScreenCoords.length < 3) return new Set();

      // Convert screen coordinates to original image coordinates
      const shapeOrigCoords = shapeScreenCoords.map(p => ({
        x: Math.round(p.x * scaleX),
        y: Math.round(p.y * scaleY)
      }));

      // Get bounding box
      let minX = Infinity, maxX = -Infinity;
      let minY = Infinity, maxY = -Infinity;

      shapeOrigCoords.forEach(p => {
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
      });

      minX = Math.max(0, minX);
      maxX = Math.min(originalWidth - 1, maxX);
      minY = Math.max(0, minY);
      maxY = Math.min(originalHeight - 1, maxY);

      const vertices = new Set();

      // Check each point within bounding box
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          if (pointInShape({ x, y }, shapeOrigCoords)) {
            const vertex = getVertexFromMapping(x, y);
            if (vertex !== null) {
              vertices.add(vertex);
            }
          }
        }
      }

      return vertices;
    }

    function recordVerticesInBlob(shapeScreenCoords) {
      const verticesInBlob = findVerticesInBlob(shapeScreenCoords);

      verticesInBlob.forEach(vertex => {
        if (!shadedVerticesSet.has(vertex)) {
          shadedVerticesSet.add(vertex);
        }
      });

      updateShadingStatus();
    }


    function clearShading() {
      shadedVerticesSet.clear();
      shadedOverlays.forEach($overlay => $overlay.remove());
      shadedOverlays = [];
      clearDrawing();
      updateShadingStatus();
    }

    function convertVertexToAllSpaces(mappingIndex) {
      const result = {
        ico8: lookupTableIco8[mappingIndex],
        ico16: lookupTableIco16[mappingIndex],
        ico32: lookupTableIco32[mappingIndex],
        icoME: lookupTableIcoME[mappingIndex],
      };
      return result;
    }

    function convertVertexToAllParcellations(mappingIndex) {
      const result = {
        ds128_aparc: ds128_aparc ? ds128_aparc[mappingIndex] : 'N/A',
        ds128_aparc_a2009s: ds128_aparc_a2009s ? ds128_aparc_a2009s[mappingIndex] : 'N/A',
        ds128_aparc_DKTatlas: ds128_aparc_DKTatlas ? ds128_aparc_DKTatlas[mappingIndex] : 'N/A',
        destrieux: destrieux_aparc ? destrieux_aparc[mappingIndex] : 'N/A',
        dk: dk_aparc ? dk_aparc[mappingIndex] : 'N/A',
        dkt: dkt_aparc ? dkt_aparc[mappingIndex] : 'N/A'
      };
      return result;
    }

    function generateShadingReport() {
      if (shadedVerticesSet.size === 0) {
        alert('No vertices have been shaded. Please shade a region first.');
        return null;
      }

      let reportText = '=== BRAIN VERTEX SHADING REPORT ===\n\n';
      reportText += `Total vertices shaded: ${shadedVerticesSet.size}\n`;
      reportText += `Timestamp: ${new Date().toISOString()}\n\n`;

      const sortedVertices = Array.from(shadedVerticesSet).sort((a, b) => a - b);

      reportText += '=== ICO SPACE CONVERSIONS ===\n\n';

      const ico8Vertices = new Set();
      const ico16Vertices = new Set();
      const ico32Vertices = new Set();
      const icoMEVertices = new Set();


      sortedVertices.forEach(mappingIdx => {
        const spaces = convertVertexToAllSpaces(mappingIdx);
        ico8Vertices.add(spaces.ico8);
        ico16Vertices.add(spaces.ico16);
        ico32Vertices.add(spaces.ico32);
        icoMEVertices.add(spaces.icoME);
      });

      reportText += `ICO8 Vertices (${ico8Vertices.size}):\n`;
      reportText += Array.from(ico8Vertices).sort((a, b) => a - b).join(', ') + '\n\n';

      reportText += `ICO16 Vertices (${ico16Vertices.size}):\n`;
      reportText += Array.from(ico16Vertices).sort((a, b) => a - b).join(', ') + '\n\n';

      reportText += `ICO32 Vertices (${ico32Vertices.size}):\n`;
      reportText += Array.from(ico32Vertices).sort((a, b) => a - b).join(', ') + '\n\n';

      reportText += `ICOME Vertices (${icoMEVertices.size}):\n`;
      reportText += Array.from(icoMEVertices).sort((a, b) => a - b).join(', ') + '\n\n';

      const destrieixLabels = new Set();
      const dkLabels = new Set();
      const dktLabels = new Set();
      const ds128Aparc = new Set();
      const ds128AparcA2009s = new Set();
      const ds128AparcDKT = new Set();

      sortedVertices.forEach(mappingIdx => {
        const parcs = convertVertexToAllParcellations(mappingIdx);
        destrieixLabels.add(parcs.destrieux);
        dkLabels.add(parcs.dk);
        dktLabels.add(parcs.dkt);
        ds128Aparc.add(parcs.ds128_aparc);
        ds128AparcA2009s.add(parcs.ds128_aparc_a2009s);
        ds128AparcDKT.add(parcs.ds128_aparc_DKTatlas);
      });


      reportText += '=== DETAILED VERTEX MAPPING ===\n\n';
      reportText += 'MappingIndex | ICO8 | ICO16 | ICO32 | ICOME |\n';
      reportText += '-'.repeat(150) + '\n';

      sortedVertices.forEach(mappingIdx => {
        const spaces = convertVertexToAllSpaces(mappingIdx);
        const parcs = convertVertexToAllParcellations(mappingIdx);
        reportText += `${mappingIdx} | ${spaces.ico8} | ${spaces.ico16} | ${spaces.ico32} | ${spaces.icoME} |\n`;
      });

      return reportText;
    }

    function downloadTextFile(text, filename) {
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function finishShadingAndExport() {
      const report = generateShadingReport();
      if (report) {
        const timestamp = new Date().toISOString().slice(0, 10);
        const filename = `brain_shading_report_${timestamp}.txt`;
        downloadTextFile(report, filename);

        const userConfirm = confirm('Export complete! Clear shading for a new selection?');
        if (userConfirm) {
          clearShading();
        }
      }
    }
    // -----------------------------------------------------------------
    // SHADING EVENT HANDLERS (FREEFORM BLOB)
    // -----------------------------------------------------------------

    $('#toggle-shading-btn').on('click', function () {
      toggleShadingMode();
    });

    $('#finish-shading-btn').on('click', function () {
      if (shadedVerticesSet.size === 0) {
        alert('No vertices shaded. Please shade a region first.');
        return;
      }
      finishShadingAndExport();
    });

    $('#clear-shading-btn').on('click', function () {
      clearShading();
    });

    image.on('dragstart', function (e) {
      if (shadingModeActive) {
        e.preventDefault();
        return false;
      }
    });

    image.on('mousedown', function (e) {
      if (shadingModeActive) {
        e.preventDefault();
      }
      if (!shadingModeActive) return;

      const rect = this.getBoundingClientRect();
      const xScreen = e.clientX - rect.left;
      const yScreen = e.clientY - rect.top;

      createDrawingCanvas();
      drawBrushStroke(xScreen, yScreen);
      isDrawing = true;
    });

    image.on('mousemove', function (e) {
      if (!shadingModeActive || !isDrawing) return;

      const rect = this.getBoundingClientRect();
      const xScreen = e.clientX - rect.left;
      const yScreen = e.clientY - rect.top;

      if (xScreen >= 0 && xScreen <= rect.width && yScreen >= 0 && yScreen <= rect.height) {
        drawBrushStroke(xScreen, yScreen);
      }
    });

    $(document).on('mouseup', function () {
      if (shadingModeActive && isDrawing && drawingPoints.length >= 3) {
        isDrawing = false;
        closeBlobShape();
        recordVerticesInBlob(drawingPoints);
      } else if (shadingModeActive && isDrawing) {
        isDrawing = false;
      }
    });

    image.on('mouseleave', function () {
      isDrawing = false;
    });

    image.on('mousemove', e => {
      const rect = image[0].getBoundingClientRect();
      const x = e.clientX - rect.left,
        y = e.clientY - rect.top;
      if (x < 0 || y < 0 || x > rect.width || y > rect.height) { vertexInfo.text('No vertex selected'); return; }

      const mx = Math.floor(x * scaleX),
        my = Math.floor(y * scaleY);
      const vertex = getVertexFromMapping(mx, my);

      if (vertex === null) {
        vertexInfo.text('No vertex selected');
        return;
      }

      const ico8 = lookupTableIco8[vertex];
      const ico16 = lookupTableIco16[vertex];
      const ico32 = lookupTableIco32[vertex];
      const icoME = lookupTableIcoME[vertex];

      let dataValue = 'N/A';
      if (dataMatrix && currentIcoSpace) {
        const lt = getLookupTable(currentIcoSpace);
        if (lt) {
          const idx = lt[vertex];
          dataValue = dataMatrix[idx] !== undefined ? dataMatrix[idx] : 'N/A';
        }
      }

      const html = `
        <br><strong>onavg coordinate:</strong><br>
        ico8: ${ico8}<br>
        ico16: ${ico16}<br>
        ico32: ${ico32}<br>
        MEBRAIN: ${icoME}<br><br>
        <strong>Data Matrix Value in ${currentIcoSpace || '—'} space:</strong><br>
        value: ${dataValue}<br><br>
      `;
      vertexInfo.html(html);
    });
    image.on('mouseleave', () => { vertexInfo.text('No vertex selected'); });

    /* --------------------------------------------------------------
       Initialise everything
       -------------------------------------------------------------- */
    $(document).ready(() => {
      displayFileName();
      loadData();
      $(window).on('resize', updateDisplaySize);
    });
  </script>
</body>

</html>
